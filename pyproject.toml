[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "errdoc-cli"
version = "0.1.0"
description = "A cross-platform CLI error analyzer with local and API diagnosis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mhdjamadi1994", email = "mohamadhasanjamadi1994@gmail.com"}]
maintainers = [{name = "Mhdjamadi1994", email = "mohamadhasanjamadi1994@gmail.com"}]
keywords = ["cli", "debugging", "error-analysis", "traceback", "ollama", "llm"]
requires-python = ">=3.10"
dependencies = ["click>=8.1", "rich>=13.7"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]

[project.urls]
Homepage = "https://github.com/Mhdjamadi1994/errdoc-cli"
Repository = "https://github.com/Mhdjamadi1994/errdoc-cli"
Issues = "https://github.com/Mhdjamadi1994/errdoc-cli/issues"
Security = "https://github.com/Mhdjamadi1994/errdoc-cli/security/advisories/new"

[project.optional-dependencies]
test = ["pytest>=8"]


[project.scripts]
errdoc = "errdoc.cli:main"
fix = "errdoc.cli:fix"

[tool.setuptools.packages.find]
where = ["."]
include = ["errdoc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires ERRDOC_RUN_SANDBOX_INTEGRATION=1 and a prepared container image"]
