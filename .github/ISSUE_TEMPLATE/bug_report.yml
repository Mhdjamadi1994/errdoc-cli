name: Bug report
description: Report a reproducible errdoc problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include access tokens, API keys, private logs, personal paths, or other sensitive data.
        Security vulnerabilities must be reported through the repository's private vulnerability reporting flow, not a public issue.
  - type: input
    id: version
    attributes:
      label: errdoc version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: "Windows 11, Python 3.14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include a minimal synthetic example and redact sensitive details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only a reviewed, redacted excerpt if error output is needed.
    validations:
      required: true
