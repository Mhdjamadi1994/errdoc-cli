name: Build and verify release artifacts

on:
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Publish the verified build from this run to TestPyPI only"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test, build, and inspect distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; tag=os.environ['RELEASE_TAG']; assert tag == 'v'+version, f'{tag} does not match v{version}'"
      - name: Install build and test tools
        run: python -m pip install build twine pytest
      - name: Run unit and regression tests
        run: python -m pytest -q -m "not integration"
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Save artifacts for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: errdoc-release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish verified distributions to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/errdoc-cli/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download distributions built and checked in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: errdoc-release-dist
          path: dist/
      - name: Publish to TestPyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
