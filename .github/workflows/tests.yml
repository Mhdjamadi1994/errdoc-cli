name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run cross-platform unit and regression tests
        run: python -m pytest -q -m "not integration"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install built wheel and check console commands
        run: |
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.whl')[0]])"
          errdoc --version
          fix --version
      - name: Install built source distribution and check console commands
        run: |
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.tar.gz')[0]])"
          errdoc --version
          fix --version

  sandbox-integration:
    name: Linux / Python 3.11 / Docker sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Prepare sandbox image
        run: docker pull python:3.11-slim
      - name: Run sandbox integration checks
        env:
          ERRDOC_RUN_SANDBOX_INTEGRATION: "1"
          ERRDOC_CONTAINER_RUNTIME: docker
        run: python -m pytest -q -m integration tests/test_executor_integration.py

  podman-integration:
    name: Linux / Python 3.11 / Podman sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Install Podman from Ubuntu repositories
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Prepare sandbox image
        run: podman pull docker.io/library/python:3.11-slim
      - name: Run sandbox integration checks using Podman
        env:
          ERRDOC_RUN_SANDBOX_INTEGRATION: "1"
          ERRDOC_CONTAINER_RUNTIME: podman
        run: python -m pytest -q -m integration tests/test_executor_integration.py

  dependency-audit:
    name: Ubuntu / Python 3.11 / Runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Install locked runtime dependencies
        run: python -m pip install --target /tmp/errdoc-runtime --requirement requirements-audit.txt
      - name: Audit locked runtime dependencies
        run: python -m pip_audit --path /tmp/errdoc-runtime --progress-spinner off
